name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this workflow only reads the repo and runs
# tests. It never needs to write anything back, so no elevated
# permissions are granted.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          # Dummy values -- tests only need config.py to import
          # successfully, never real credentials.
          TELEGRAM_BOT_TOKEN: "123456:ci-test-token"
          OPENAI_API_KEY: "sk-ci-test"
        run: pytest tests/ -q

  frontend:
    name: Frontend lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci (not npm install) -- respects the lockfile exactly and
        # will not regenerate/drift it based on the runner's npm version.
        # Confirmed locally: npm install caused unrelated lockfile diffs,
        # npm ci did not.
        run: npm ci

      - name: Lint
        # oxlint is already installed via devDependencies (npm ci above).
        # It does not require any configuration file to run; the existing
        # .oxlintrc.json in the frontend directory defines the rules.
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
