[pytest]
# Ensures the repo root is always on sys.path for test collection,
# regardless of whether pytest is invoked as `pytest` (as CI does) or
# `python -m pytest` (which happens to add the cwd to sys.path on its
# own). Without this, bare `pytest` cannot import repo-root modules
# like `database`, `config`, `backend`, etc. from files under tests/.
pythonpath = .
